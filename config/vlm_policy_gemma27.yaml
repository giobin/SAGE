# Gemma3-27B as a zero-shot policy (VLM-as-Policy, Table 2)

defaults:
  - base_experiment
  - env: frozenlake_image_big_random
  - training: ppo_cnn
  - override training/guidance_model: gemma3-27b
  - override training/guidance_model/cache: large_cache_guidance_model
  - override hydra/sweeper: list
  - _self_

hydra:
  mode: MULTIRUN
  sweeper:
    grid_params:
      seed: 1,2,3
      env: frozenlake_image_big_random,ezpoints_image,card_maze_suit_normal,minigrid_fetch_5x5,minigrid_gotodoor_5x5,minigrid_lavagap_s5

exp_name: vlm_policy_gemma27
vlm_guidance: true

training:
  guidance_model:
    guidance_type: action
    cache:
      cache_size: 10000
