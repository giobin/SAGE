# Sweep of the entropy threshold nu on CardMaze (Table 8)

defaults:
  - base_experiment
  - env: card_maze_suit_normal
  - training: ppo_cnn
  - override training/guidance_model: qwen3_5-27b-nothink
  - override hydra/sweeper: list
  - _self_

hydra:
  mode: MULTIRUN
  sweeper:
    grid_params:
      seed: 1,2,3
      training.guidance_model.guidance_threshold: 0.0,0.1,0.25,0.5,0.75,0.9,1.0

exp_name: sweep_threshold
vlm_guidance: true

training:
  guidance_model:
    guidance_type: action
    cache:
      use_cache: false
  bc_coef: 1.0
  bc_schedule: linear
  awbc_filter: exp
  awbc_temperature: 0.5
