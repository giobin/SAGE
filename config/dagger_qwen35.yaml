# DAgger baseline with Qwen3.5-27B labels, run for 25k steps (Table 1)
# Run with: python -m src.train.train_dagger_vlm -cn dagger_qwen35

defaults:
  - base_experiment
  - env: frozenlake_image_big_random
  - training: dagger_vlm
  - override training/guidance_model: qwen3_5-27b-nothink
  - override hydra/sweeper: list
  - _self_

hydra:
  mode: MULTIRUN
  sweeper:
    grid_params:
      seed: 1,2,3
      env: frozenlake_image_big_random,ezpoints_image,card_maze_suit_normal,minigrid_fetch_5x5,minigrid_gotodoor_5x5,minigrid_lavagap_s5

exp_name: dagger_qwen35
vlm_guidance: true

training:
  guidance_model:
    guidance_type: action
    cache:
      use_cache: false
  beta_schedule: exponential
  beta_start: 1.0
  beta_decay: 0.5
  beta_end: 0.0
  buffer_size: 25000
  bc_batch_size: 128
  bc_updates_per_iter: 50

env:
  total_timesteps: 25000
