# @package hydra.launcher
# Generic SLURM launcher. Set account and partition for your cluster, e.g.:
#   hydra/launcher=slurm_generic hydra.launcher.account=my_account hydra.launcher.partition=my_partition
# The 27B teachers were run with 2 GPUs (A100 64GB); runs without a VLM need 1.

_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher

submitit_folder: ${hydra.sweep.dir}/submitit/%j
timeout_min: 1440
nodes: 1
tasks_per_node: 1
cpus_per_task: 8
gpus_per_node: 2
mem_gb: 64
name: ${hydra.job.name}

partition: null
account: null
